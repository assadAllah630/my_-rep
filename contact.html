    <main class="contact-container">
        <h1>Get in Touch</h1>
        
        <section class="contact-content">
            <div class="contact-info">
                <div class="contact-item">
                    <i class="fas fa-envelope"></i>
                    <h3>Email</h3>
                    <a href="mailto:assad.allah630@gmail.com">assad.allah630@gmail.com</a>
                </div>

                <div class="contact-item">
                    <i class="fab fa-whatsapp"></i>
                    <h3>WhatsApp</h3>
                    <a href="https://wa.me/96176876530" target="_blank">+961 76 876 530</a>
                </div>

                <div class="contact-item">
                    <i class="fab fa-linkedin"></i>
                    <h3>LinkedIn</h3>
                    <a href="https://www.linkedin.com/in/assad-allah-alebrahim-6264361b5" target="_blank">Connect on LinkedIn</a>
                </div>

                <div class="contact-item">
                    <i class="fab fa-facebook"></i>
                    <h3>Facebook</h3>
                    <a href="https://www.facebook.com/AssadAllahAlebrahim/" target="_blank">Follow on Facebook</a>
                </div>
            </div>

            <form class="contact-form" id="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn submit-btn">Send Message</button>
            </form>
        </section>
    </main>
